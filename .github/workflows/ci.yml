name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      # Merge groups run everything; PRs and main pushes use the same filters.
      app: ${{ github.event_name == 'merge_group' || steps.filter.outputs.app == 'true' || steps.dependencies.outputs.changed == 'true' }}
      rust: ${{ github.event_name == 'merge_group' || steps.filter.outputs.rust == 'true' || steps.dependencies.outputs.changed == 'true' }}
      site: ${{ github.event_name == 'merge_group' || steps.filter.outputs.site == 'true' || steps.dependencies.outputs.changed == 'true' }}
      docker: ${{ github.event_name == 'merge_group' || steps.filter.outputs.docker == 'true' || steps.dependencies.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3.0.4
        with:
          filters: |
            app:
              - 'app/**'
              - 'packages/ui/**'
              - 'shared/**'
              - 'test/browser/**'
              - 'playwright.config.ts'
              - 'tsconfig.browser.json'
              - 'package.json'
              - 'bunfig.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'app/src-tauri/**'
              - 'package.json'
              - 'bunfig.toml'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - 'packages/ui/**'
              - 'shared/**'
              - 'package.json'
              - 'bunfig.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            dependencies:
              - 'bun.lock'
            docker:
              - 'bot/**'
              - 'shared/**'
              - 'Dockerfile.bot'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'package.json'
              - 'app/package.json'
              - 'packages/ui/package.json'
              - 'site/package.json'
              - '.github/workflows/ci.yml'
      - uses: oven-sh/setup-bun@v2
        if: steps.filter.outputs.dependencies == 'true'
        with:
          bun-version-file: package.json
      # A workspace version bump alone does not change dependencies.
      - id: dependencies
        if: steps.filter.outputs.dependencies == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bun - <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";
          const base = Bun.spawnSync(["git", "show", `${process.env.BASE_SHA}:bun.lock`]);
          const dependencies = (text) => {
            const lock = Bun.JSON5.parse(text);
            for (const workspace of Object.values(lock.workspaces)) delete workspace.version;
            return JSON.stringify(lock);
          };
          const changed = base.exitCode !== 0 ||
            dependencies(base.stdout.toString()) !== dependencies(readFileSync("bun.lock", "utf8"));
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          JS

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx biome ci --reporter=github
      - run: bun run check:versions
      - run: bun run typecheck
      - run: bun run test

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build app frontend
        run: bun run --cwd app build
      - id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: bun run playwright install --with-deps chrome webkit
      - run: bun run test:browser
        env:
          BROWSER_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, os: ubuntu-latest, cmd: "cargo test --manifest-path app/src-tauri/Cargo.toml" }
          - { name: windows, os: windows-latest, cmd: "cargo check --manifest-path app/src-tauri/Cargo.toml" }
          - { name: macos, os: macos-latest, cmd: "cargo check --manifest-path app/src-tauri/Cargo.toml" }
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # tauri-build validates that frontendDist exists, so cargo needs app/dist even for `check`.
      - run: bun run --cwd app build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"
      - run: ${{ matrix.cmd }}

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd site check
      - name: Build site without deploying
        run: bun run build:site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_BOT_CLIENT_ID: ${{ vars.PUBLIC_BOT_CLIENT_ID }}

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bot
          push: false
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  status:
    if: always()
    needs: [changes, checks, app, rust, site, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks and every selected build
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            .changes.result == "success" and
            .checks.result == "success" and
            (.app.result == "success" or (.app.result == "skipped" and .changes.outputs.app != "true")) and
            (.rust.result == "success" or (.rust.result == "skipped" and .changes.outputs.rust != "true")) and
            (.site.result == "success" or (.site.result == "skipped" and .changes.outputs.site != "true")) and
            (.docker.result == "success" or (.docker.result == "skipped" and .changes.outputs.docker != "true"))
          '
