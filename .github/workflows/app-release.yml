name: app-release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft releases have no tag yet and are listed only for tokens with write access.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Keep the write token out of the checkout that runs repository scripts.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verify synchronized versions
        run: bun run check:versions
      - id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version app/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A failed lookup fails the job: rebuilding would overwrite the assets of an existing draft.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | "\(.tag_name)\t\(.draft)"')
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/app-v$version" --jq '.[].ref')
          if grep -qxF "app-v$version"$'\t'true <<< "$releases"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "A draft release app-v$version already exists; nothing to build. If this commit changes the app, bump the app version to release it." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qxF "app-v$version"$'\t'false <<< "$releases" || grep -qxF "refs/tags/app-v$version" <<< "$tags"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "app-v$version already exists; nothing to build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  tauri:
    needs: version
    if: needs.version.outputs.released == 'false'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Linux release baseline compatible with Ubuntu 22.04 and newer.
          - { name: ubuntu, os: ubuntu-22.04, args: "" }
          - { name: windows, os: windows-latest, args: "" }
          - { name: macos, os: macos-latest, args: "--target universal-apple-darwin" }
    name: tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── Dépendances système (Linux uniquement) ────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Bun ──────────────────────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: bun-app-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-app-${{ runner.os }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS : les deux cibles sont nécessaires pour le binaire universel
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      # ── Build Tauri ───────────────────────────────────────────────────────────
      # L'action gère automatiquement beforeBuildCommand (bun run build = Vite)
      # et détecte Bun via la présence de bun.lock.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: app-v__VERSION__
          releaseCommitish: ${{ github.event.workflow_run.head_sha }}
          releaseName: App v__VERSION__
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
