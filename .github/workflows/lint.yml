name: Lint

# Déclenché sur tout push et toute PR, quelle que soit la branche ou le chemin.
# Biome est rapide (<30 s) — aucun filtre de chemin nécessaire.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  biome:
    name: Biome CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-lint-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-lint-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # biome ci = read-only (pas de --write), sort avec code 1 si violation.
      # --reporter=github émet des annotations dans la diff de la PR.
      - name: Biome CI
        run: bunx biome ci --reporter=github

  test:
    name: Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-test-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-test-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd app build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml

  site-check:
    name: Astro check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd site check
